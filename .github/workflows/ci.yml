# 올릴 때마다: 설치 → 타입 검사 → 테스트(공장 정의·MES·시뮬레이터) → 빌드
name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: 타입 검사·테스트·빌드
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: |
            sim/requirements.txt
            sim/requirements-opcua.txt

      # postinstall이 shared를 빌드하고(factory.json 포함) Prisma 클라이언트를 만든다
      - name: 설치
        run: npm ci

      - name: 타입 검사
        run: npm run typecheck

      - name: 공장 정의 테스트 (shared)
        run: npm run test -w shared

      - name: MES 테스트 (server · OEE·SPC·보기 전용)
        run: npm run test -w server

      # OPC UA 경로(가상 PLC → 엣지 게이트웨이) 테스트까지 돌도록 asyncua도 설치한다
      - name: 시뮬레이터 테스트 (sim · OPC UA 경로 포함)
        env:
          PYTHON: python
        run: |
          npm run sim:setup:opcua
          npm run test:sim -- -v

      - name: 빌드 (server · client)
        run: |
          npm run build -w server
          npm run build -w client
